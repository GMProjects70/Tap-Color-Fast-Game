<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- 4 Color Quadrants -->
  <!-- Red Top Left -->
  <rect x="76" y="76" width="168" height="168" rx="36" fill="#ef4444" filter="url(#shadow)" />
  <!-- Blue Top Right -->
  <rect x="268" y="76" width="168" height="168" rx="36" fill="#3b82f6" filter="url(#shadow)" />
  <!-- Green Bottom Left -->
  <rect x="76" y="268" width="168" height="168" rx="36" fill="#10b981" filter="url(#shadow)" />
  <!-- Yellow Bottom Right -->
  <rect x="268" y="268" width="168" height="168" rx="36" fill="#facc15" filter="url(#shadow)" />

  <!-- Center Fast Tap Lightning Badge -->
  <circle cx="256" cy="256" r="64" fill="#090d16" stroke="#fbbf24" stroke-width="6" filter="url(#shadow)" />
  <path d="M266 200 L230 256 L262 256 L246 312 L286 250 L254 250 Z" fill="url(#boltGrad)" />
</svg>
